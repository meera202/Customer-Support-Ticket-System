# Multi-service stack — run with Docker Compose against env/<environment>.env
# Separate projects (-p / COMPOSE_PROJECT_NAME) allow dev, testing, and production stacks
# on one machine without port or volume clashes.
services:
  mongo:
    image: mongo:7.0
    restart: ${RESTART_POLICY:-no}
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ticketDB
    ports:
      - "${MONGO_HOST_PORT:?}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  auth-service:
    image: ${AUTH_SERVICE_IMAGE:-cst-auth-service}:${IMAGE_TAG_SUFFIX:-latest}
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE_DIR: auth-service
    restart: ${RESTART_POLICY:-no}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in env file}
      PORT: "5001"
      MONGODB_URI: mongodb://${MONGO_HOST:-mongo}:27017/${MONGO_DB_AUTH:?}
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5001/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 50s

  ticket-service:
    image: ${TICKET_SERVICE_IMAGE:-cst-ticket-service}:${IMAGE_TAG_SUFFIX:-latest}
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE_DIR: ticket-service
    restart: ${RESTART_POLICY:-no}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?}
      PORT: "5000"
      MONGODB_URI: mongodb://${MONGO_HOST:-mongo}:27017/${MONGO_DB_TICKETS:?}
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 35s

  notification-service:
    image: ${NOTIFICATION_SERVICE_IMAGE:-cst-notification-service}:${IMAGE_TAG_SUFFIX:-latest}
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE_DIR: notification-service
    restart: ${RESTART_POLICY:-no}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "5003"
      MONGODB_URI: mongodb://${MONGO_HOST:-mongo}:27017/${MONGO_DB_NOTIFICATIONS:?}
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5003"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5003/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 50s

  support-service:
    image: ${SUPPORT_SERVICE_IMAGE:-cst-support-service}:${IMAGE_TAG_SUFFIX:-latest}
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE_DIR: support-service
    restart: ${RESTART_POLICY:-no}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "5002"
    expose:
      - "5002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5002/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ${FRONTEND_SERVICE_IMAGE:-cst-frontend}:${IMAGE_TAG_SUFFIX:-latest}
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: ${RESTART_POLICY:-no}
    ports:
      - "${FRONTEND_HOST_PORT:?}:80"
    depends_on:
      mongo:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      support-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
    name: ${COMPOSE_PROJECT_NAME}_${MONGO_VOLUME_NAME:-mongo_data}
