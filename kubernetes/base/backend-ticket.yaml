---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ticket-service
  name: ticket-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
        - name: ticket-service
          image: cst-ticket-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: cst-databases
                  key: NODE_ENV
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: cst-databases
                  key: MONGO_TICKET_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cst-jwt
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 25
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ticket-service
  name: ticket-service
spec:
  selector:
    app: ticket-service
  ports:
    - port: 5000
      targetPort: 5000
