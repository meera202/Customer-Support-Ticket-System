apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  annotations:
    # Remove or replace depending on your ingress controller / ingressClass
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: cst-production.local.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
