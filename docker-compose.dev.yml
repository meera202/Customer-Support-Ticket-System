services:
  dev-mongo:
    image: mongo:7
    container_name: cst-dev-mongo
    restart: unless-stopped
    ports:
      - "27020:27017"
    volumes:
      - dev_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cst-dev-net

  dev-auth-service:
    build:
      context: ./backend/auth-service
    image: cst/auth-service:dev
    restart: unless-stopped
    environment:
      PORT: 5001
      JWT_SECRET: cst-dev-secret-change-me
      MONGODB_URI: mongodb://dev-mongo:27017/cstAuthDev
    depends_on:
      dev-mongo:
        condition: service_healthy
    ports:
      - "5001:5001"
    networks:
      cst-dev-net:
        aliases:
          - auth-service

  dev-ticket-service:
    build:
      context: ./backend/ticket-service
    image: cst/ticket-service:dev
    restart: unless-stopped
    environment:
      PORT: 5000
      JWT_SECRET: cst-dev-secret-change-me
      MONGODB_URI: mongodb://dev-mongo:27017/ticketDBDev
    depends_on:
      dev-mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      cst-dev-net:
        aliases:
          - ticket-service

  dev-support-service:
    build:
      context: ./backend/support-service
    image: cst/support-service:dev
    restart: unless-stopped
    environment:
      PORT: 5002
    ports:
      - "5002:5002"
    networks:
      cst-dev-net:
        aliases:
          - support-service

  dev-notification-service:
    build:
      context: ./backend/notification-service
    image: cst/notification-service:dev
    restart: unless-stopped
    environment:
      PORT: 5003
      MONGODB_URI: mongodb://dev-mongo:27017/cstNotificationsDev
    depends_on:
      dev-mongo:
        condition: service_healthy
    ports:
      - "5003:5003"
    networks:
      cst-dev-net:
        aliases:
          - notification-service

  dev-frontend:
    build:
      context: ./frontend
    image: cst/frontend:dev
    restart: unless-stopped
    depends_on:
      - dev-auth-service
      - dev-ticket-service
      - dev-support-service
      - dev-notification-service
    ports:
      - "8080:80"
    networks:
      - cst-dev-net

volumes:
  dev_mongo_data:

networks:
  cst-dev-net:
