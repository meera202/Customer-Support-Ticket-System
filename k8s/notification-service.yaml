apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cst
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: cst/notification-service:prod
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: cst-config
                  key: NOTIFICATION_PORT
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: cst-config
                  key: MONGODB_URI_NOTIFICATION
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: cst
spec:
  selector:
    app: notification-service
  ports:
    - port: 5003
      targetPort: 5003
