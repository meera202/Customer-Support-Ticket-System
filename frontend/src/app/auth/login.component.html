<div class="auth-shell">
  <div class="auth-card">
    <h1>Sign in</h1>
    <p class="muted">Customer Support System</p>

    <label>
      Username
      <input [(ngModel)]="username" name="username" autocomplete="username" />
    </label>
    <label>
      Password
      <input
        [(ngModel)]="password"
        name="password"
        type="password"
        autocomplete="current-password"
      />
    </label>

    <p class="message error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="button" (click)="submit()">Log in</button>
    <p class="muted footer">
      No account?
      <button type="button" class="link-btn" (click)="goRegister()">Register</button>
    </p>
  </div>
</div>
